flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  # assets/icon.png is a 1024x1024 opaque image whose glyph covers roughly the
  # middle half of the canvas, so it stays inside the adaptive-icon safe zone.
  # The background matches the image's own backdrop.
  adaptive_icon_background: "#313131"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 26
  remove_alpha_ios: true
